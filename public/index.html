<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bedrock AFK Bot</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{width:min(900px,calc(100% - 30px));margin:50px auto}.header{display:flex;align-items:center;gap:14px;margin-bottom:25px}
.logo{width:42px;height:42px;border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;font-size:22px}
h1{margin:0;font-size:24px}.subtitle{color:var(--muted);margin-top:4px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.panel-title{padding:15px 18px;border-bottom:1px solid var(--border);font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,1fr)}
.item{padding:18px;border-bottom:1px solid var(--border)}.item:nth-child(odd){border-right:1px solid var(--border)}
.label{color:var(--muted);font-size:13px;margin-bottom:7px}.value{font-size:16px;word-break:break-word}.status{display:inline-flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--yellow)}.dot.online{background:var(--green);box-shadow:0 0 8px var(--green)}.dot.offline{background:var(--red)}
.footer{color:var(--muted);font-size:13px;text-align:center;margin-top:25px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.item:nth-child(odd){border-right:none}}
</style>
</head>
<body>
<div class="container">
<div class="header"><div class="logo">◉</div><div><h1>Bedrock AFK Bot</h1><div class="subtitle">Lightweight Minecraft Bedrock client</div></div></div>
<div class="panel"><div class="panel-title">Bot Status</div><div class="grid">
<div class="item"><div class="label">STATUS</div><div class="value status"><span id="dot" class="dot"></span><span id="status">Loading...</span></div></div>
<div class="item"><div class="label">USERNAME</div><div id="username" class="value">—</div></div>
<div class="item"><div class="label">SERVER</div><div id="server" class="value">—</div></div>
<div class="item"><div class="label">UPTIME</div><div id="uptime" class="value">—</div></div>
<div class="item"><div class="label">COORDINATES</div><div id="coords" class="value">Waiting...</div></div>
<div class="item"><div class="label">BLOCK UNDER FEET</div><div id="block" class="value">Waiting...</div></div>
<div class="item"><div class="label">RECONNECTS</div><div id="reconnects" class="value">0</div></div>
<div class="item"><div class="label">LAST EVENT</div><div id="event" class="value">—</div></div>
</div></div>
<div class="footer">Bedrock Protocol • Node.js • Exact block names require world/chunk data</div>
</div>
<script>
function formatUptime(s){s=Number(s);const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s=Math.floor(s%60);return `${d}d ${h}h ${m}m ${s}s`}
async function update(){try{const r=await fetch("/api/status",{cache:"no-store"}),d=await r.json();document.getElementById("status").textContent=d.status;document.getElementById("username").textContent=d.username;document.getElementById("server").textContent=d.server;document.getElementById("uptime").textContent=formatUptime(d.uptime);document.getElementById("reconnects").textContent=d.reconnects;document.getElementById("event").textContent=d.lastEvent;
if(d.position){document.getElementById("coords").textContent=`X ${Number(d.position.x).toFixed(2)}  Y ${Number(d.position.y).toFixed(2)}  Z ${Number(d.position.z).toFixed(2)}`}
if(d.blockPosition){document.getElementById("block").textContent=`X ${d.blockPosition.x}  Y ${d.blockPosition.y}  Z ${d.blockPosition.z}`}const dot=document.getElementById("dot");dot.className="dot";if(d.status==="Online")dot.classList.add("online");if(["Disconnected","Kicked","Error"].includes(d.status))dot.classList.add("offline")}catch(e){document.getElementById("status").textContent="Dashboard error"}}
update();setInterval(update,2000);
</script>
</body>
</html>
